<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Small appliances and gifting corner">
  <defs>
    <linearGradient id="c6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFBEB"/><stop offset="1" stop-color="#FDE68A"/></linearGradient>
    <linearGradient id="j6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#94A3B8"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#c6)"/>
  <!-- shelves -->
  <g fill="#D97706" opacity="0.35"><rect x="60" y="240" width="680" height="12" rx="6"/><rect x="60" y="400" width="680" height="12" rx="6"/></g>
  <!-- kettle -->
  <g><rect x="100" y="150" width="90" height="90" rx="16" fill="#0F172A"/><path d="M190 170h26v40h-26z" fill="#334155"/><rect x="118" y="132" width="54" height="18" rx="9" fill="#F59E0B"/></g>
  <!-- mixer -->
  <g><rect x="240" y="160" width="90" height="80" rx="14" fill="#1E293B"/><rect x="256" y="118" width="58" height="46" rx="10" fill="url(#j6)"/></g>
  <!-- induction -->
  <g><rect x="380" y="196" width="130" height="44" rx="10" fill="#0B1222"/><circle cx="445" cy="218" r="16" fill="#F59E0B" opacity="0.8"/></g>
  <!-- iron -->
  <g><path d="M570 240h150l-16-46h-96z" fill="#F8FAFC"/><rect x="580" y="170" width="90" height="18" rx="9" fill="#2563EB"/></g>
  <!-- purifier -->
  <g><rect x="120" y="292" width="100" height="108" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/><path d="M170 316c14 16 22 24 22 34a22 22 0 1 1-44 0c0-10 8-18 22-34z" fill="#60A5FA"/></g>
  <!-- toaster -->
  <g><rect x="280" y="320" width="120" height="80" rx="14" fill="#E2E8F0"/><rect x="300" y="308" width="30" height="16" rx="6" fill="#94A3B8"/><rect x="350" y="308" width="30" height="16" rx="6" fill="#94A3B8"/></g>
  <!-- blender -->
  <g><rect x="470" y="300" width="80" height="100" rx="12" fill="#0F172A"/><rect x="486" y="270" width="48" height="34" rx="8" fill="url(#j6)"/></g>
  <!-- fan -->
  <g transform="translate(650 350)"><circle r="46" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/><circle r="14" fill="#2563EB"/><g stroke="#94A3B8" stroke-width="4" fill="none"><circle r="30"/><path d="M-46 0h92M0-46v92"/></g></g>
  <rect x="0" y="470" width="800" height="130" fill="#0F172A"/>
  <text x="400" y="530" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="26" font-weight="700" fill="#F8FAFC" letter-spacing="4">SMALL APPLIANCES</text>
  <text x="400" y="562" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="14" fill="#94A3B8" letter-spacing="3">KITCHEN · GIFTING · DAILY USE</text>
</svg>
