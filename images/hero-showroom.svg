<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" role="img" aria-label="Kamadgiri Electronics premium showroom interior">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1222"/><stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/><stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/><stop offset="0.55" stop-color="#3B82F6"/><stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59E0B"/><stop offset="1" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E2E8F0"/><stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.55"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="700" fill="url(#sky)"/>
  <ellipse cx="450" cy="250" rx="420" ry="260" fill="url(#glow)"/>

  <!-- ceiling light strips -->
  <g fill="#F8FAFC" opacity="0.16">
    <rect x="120" y="42" width="660" height="8" rx="4"/>
    <rect x="190" y="80" width="520" height="6" rx="3"/>
  </g>

  <!-- back wall panel -->
  <rect x="60" y="110" width="780" height="360" rx="16" fill="#111C33" opacity="0.85"/>

  <!-- TV video wall -->
  <g>
    <rect x="96" y="140" width="230" height="140" rx="8" fill="url(#screen)"/>
    <rect x="340" y="140" width="230" height="140" rx="8" fill="#1D4ED8"/>
    <rect x="584" y="140" width="220" height="140" rx="8" fill="url(#screen)" opacity="0.8"/>
    <g fill="#0B1222" opacity="0.25">
      <circle cx="211" cy="210" r="26"/><circle cx="455" cy="210" r="26"/><circle cx="694" cy="210" r="26"/>
    </g>
    <g fill="#F8FAFC" opacity="0.9">
      <path d="M203 198l22 12-22 12z"/><path d="M447 198l22 12-22 12z"/><path d="M686 198l22 12-22 12z"/>
    </g>
  </g>

  <!-- brand strip -->
  <rect x="96" y="304" width="708" height="46" rx="23" fill="#0B1222" opacity="0.8"/>
  <text x="450" y="334" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="20" font-weight="700" fill="#F8FAFC" letter-spacing="6">KAMADGIRI ELECTRONICS</text>

  <!-- appliances row -->
  <g>
    <!-- refrigerator -->
    <rect x="100" y="372" width="120" height="200" rx="12" fill="url(#metal)"/>
    <rect x="100" y="372" width="120" height="72" rx="12" fill="#CBD5E1"/>
    <rect x="206" y="392" width="6" height="36" rx="3" fill="#64748B"/>
    <rect x="206" y="462" width="6" height="60" rx="3" fill="#64748B"/>
    <!-- washing machine -->
    <rect x="250" y="412" width="130" height="160" rx="12" fill="#F1F5F9"/>
    <circle cx="315" cy="500" r="42" fill="#94A3B8"/><circle cx="315" cy="500" r="30" fill="#0F172A" opacity="0.8"/>
    <rect x="266" y="428" width="98" height="16" rx="8" fill="#CBD5E1"/>
    <!-- air conditioner -->
    <rect x="415" y="392" width="180" height="56" rx="14" fill="#F8FAFC"/>
    <rect x="428" y="426" width="154" height="8" rx="4" fill="#CBD5E1"/>
    <g fill="#60A5FA" opacity="0.55">
      <path d="M440 462c14 16 28 16 42 0" stroke="#60A5FA" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M498 462c14 16 28 16 42 0" stroke="#60A5FA" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
    <!-- microwave + small appliances counter -->
    <rect x="630" y="470" width="180" height="102" rx="12" fill="#1E293B"/>
    <rect x="648" y="418" width="146" height="52" rx="8" fill="#E2E8F0"/>
    <rect x="658" y="428" width="86" height="32" rx="4" fill="#0F172A" opacity="0.75"/>
    <rect x="756" y="428" width="28" height="32" rx="4" fill="#94A3B8"/>
    <!-- mixer -->
    <path d="M700 400h34l-6 18h-22z" fill="url(#warm)"/>
  </g>

  <!-- floor -->
  <rect x="0" y="572" width="900" height="128" fill="url(#floor)"/>
  <g stroke="#475569" stroke-opacity="0.4" stroke-width="2">
    <path d="M0 606h900"/><path d="M0 648h900"/>
  </g>

  <!-- reflections -->
  <g opacity="0.18" fill="#93C5FD">
    <rect x="100" y="576" width="120" height="40" rx="8"/>
    <rect x="250" y="576" width="130" height="34" rx="8"/>
    <rect x="630" y="576" width="180" height="30" rx="8"/>
  </g>

  <!-- badge -->
  <g>
    <rect x="60" y="608" width="238" height="56" rx="28" fill="url(#warm)"/>
    <text x="179" y="643" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="19" font-weight="700" fill="#3B2600">14+ YEARS OF TRUST</text>
  </g>
</svg>
