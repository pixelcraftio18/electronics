<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Delivery van and technician installing an air conditioner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFF6FF"/><stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="van" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="warm2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59E0B"/><stop offset="1" stop-color="#FCD34D"/>
    </linearGradient>
  </defs>

  <rect width="800" height="520" rx="24" fill="url(#bg)"/>
  <circle cx="660" cy="110" r="86" fill="#BFDBFE" opacity="0.7"/>
  <circle cx="120" cy="420" r="120" fill="#BFDBFE" opacity="0.5"/>

  <!-- building wall with AC -->
  <rect x="470" y="70" width="270" height="290" rx="16" fill="#F8FAFC"/>
  <rect x="500" y="110" width="210" height="60" rx="12" fill="#E2E8F0"/>
  <rect x="512" y="152" width="186" height="8" rx="4" fill="#CBD5E1"/>
  <g stroke="#60A5FA" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M528 196c16 18 32 18 48 0"/><path d="M600 196c16 18 32 18 48 0"/>
  </g>
  <!-- technician -->
  <g>
    <rect x="560" y="252" width="60" height="86" rx="18" fill="#0F172A"/>
    <circle cx="590" cy="230" r="24" fill="#FBBF24"/>
    <path d="M566 216a24 24 0 0 1 48 0z" fill="#2563EB"/>
    <rect x="612" y="252" width="60" height="16" rx="8" fill="#0F172A" transform="rotate(-32 612 252)"/>
    <rect x="546" y="338" width="22" height="60" rx="10" fill="#1E293B"/>
    <rect x="612" y="338" width="22" height="60" rx="10" fill="#1E293B"/>
  </g>
  <!-- ladder -->
  <g stroke="#94A3B8" stroke-width="8" stroke-linecap="round">
    <path d="M470 400V240"/><path d="M520 400V240"/>
    <path d="M470 270h50"/><path d="M470 310h50"/><path d="M470 350h50"/>
  </g>

  <!-- delivery van -->
  <g>
    <rect x="60" y="212" width="230" height="130" rx="16" fill="url(#van)"/>
    <path d="M290 250h64l52 56v36h-116z" fill="#3B82F6"/>
    <rect x="300" y="262" width="44" height="34" rx="6" fill="#DBEAFE"/>
    <rect x="86" y="240" width="120" height="14" rx="7" fill="#DBEAFE" opacity="0.9"/>
    <text x="146" y="300" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">FREE</text>
    <text x="146" y="324" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="14" font-weight="600" fill="#BFDBFE" letter-spacing="2">DELIVERY</text>
    <circle cx="128" cy="352" r="30" fill="#0F172A"/><circle cx="128" cy="352" r="12" fill="#94A3B8"/>
    <circle cx="330" cy="352" r="30" fill="#0F172A"/><circle cx="330" cy="352" r="12" fill="#94A3B8"/>
  </g>

  <!-- boxes -->
  <g>
    <rect x="180" y="392" width="86" height="66" rx="8" fill="url(#warm2)"/>
    <path d="M223 392v66" stroke="#B45309" stroke-width="4"/>
    <rect x="280" y="410" width="66" height="48" rx="8" fill="#E2E8F0"/>
    <path d="M313 410v48" stroke="#94A3B8" stroke-width="4"/>
  </g>

  <!-- ground -->
  <rect x="40" y="458" width="720" height="8" rx="4" fill="#94A3B8" opacity="0.5"/>
</svg>
